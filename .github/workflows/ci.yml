name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Build example reports and verify workbook formulas
        run: statusdeck build examples/tracker.xlsx --out out --iterations 5000 --verify
      - name: Benchmark (quick)
        run: python bench/run_bench.py --quick
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: example-reports
          path: out/
